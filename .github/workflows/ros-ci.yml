# The name of the workflow
name: CI

# Specifies the events that trigger the workflow
on:
  push:
    branches: [ jazzy, main ]
  pull_request:
    branches: [ jazzy, main ]

# Defines a set of jobs to be run as part of the workflow
jobs:
  # The name of the job
  ROS_CI:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - jazzy
          # - rolling
        include:
          # ROS 2 Jazzy Jalisco
          - docker_image: ubuntu:noble
            ros_distribution: jazzy
            ros_version: 2
          # ROS 2 Rolling Ridley
          # - docker_image: ubuntu:noble
          #   ros_distribution: rolling
          #   ros_version: 2
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: Setup workspace
        run: mkdir -p ros_ws/src

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      - name: Check and Install ROS dependencies
        shell: bash
        run: |
          set -e
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          echo "--- Updating rosdep definitions ---"
          rosdep update
          echo "--- Installing system dependencies for ROS 2 ${{ matrix.ros_distribution }} ---"
          rosdep install --from-paths ros_ws/src --ignore-src -y -r --rosdistro ${{ matrix.ros_distribution }} --skip-keys dynamixel_hardware_interface
          echo "--- Performing rosdep check for ROS 2 ${{ matrix.ros_distribution }} ---"
          if rosdep check --from-paths ros_ws/src --ignore-src --rosdistro ${{ matrix.ros_distribution }} --skip-keys dynamixel_hardware_interface; then
            echo "--- rosdep check passed ---"
          else
            echo "--- rosdep check failed: Missing system dependencies or unresolvable keys. ---"
            exit 1
          fi

      - name: Install ONNX Runtime
        shell: bash
        run: |
          set -e
          apt-get update && apt-get install -y curl ca-certificates
          ORT_VERSION=1.23.2
          case "$(uname -m)" in
            aarch64) ORT_ARCH=aarch64 ;;
            *) ORT_ARCH=x64 ;;
          esac
          curl -sL "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}.tgz" | tar -xz -C /tmp
          mkdir -p /usr/local/include/onnxruntime
          cp -r "/tmp/onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}/include/." /usr/local/include/onnxruntime/
          cp -r "/tmp/onnxruntime-linux-${ORT_ARCH}-${ORT_VERSION}/lib/." /usr/local/lib/
          ldconfig

      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: "https://raw.githubusercontent.com/ROBOTIS-GIT/ai_sapiens/${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}/ai_sapiens_ci.repos"
          package-name: |
            ai_sapiens
            ai_sapiens_bringup
            ai_sapiens_interfaces
            ai_sapiens_joint_group_impedance_controller
            ai_sapiens_rc_broadcaster
            ai_sapiens_description
            ai_sapiens_sim2real
