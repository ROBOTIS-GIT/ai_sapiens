# The name of the workflow
name: CI

# Specifies the events that trigger the workflow
on:
  push:
    branches: [ jazzy, main, verify/onnxruntime-nuget-20261119 ]
  pull_request:
    branches: [ jazzy, main ]

# Defines a set of jobs to be run as part of the workflow
jobs:
  Docker_Build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Build AI Sapiens image
        run: docker build --progress=plain --tag ai-sapiens-nuget --file docker/Dockerfile .
      - name: Check installed ONNX Runtime and Sim2Real linkage
        run: |
          docker run --rm --entrypoint bash ai-sapiens-nuget -e -o pipefail -c '
            source /root/ros2_ws/install/setup.bash
            node="$(ros2 pkg prefix ai_sapiens_sim2real)/lib/ai_sapiens_sim2real/ai_sapiens_sim2real_node"
            ldd "$node" | tee /tmp/linked-libs
            if grep -F "not found" /tmp/linked-libs; then exit 1; fi
            grep -E "libonnxruntime.so.1 => /usr/local/lib/" /tmp/linked-libs
            printf "%s\n" "#include <onnxruntime_cxx_api.h>" "#include <iostream>" "int main() { Ort::Env env(ORT_LOGGING_LEVEL_WARNING, \"nuget-smoke\"); std::cout << Ort::GetVersionString(); }" > /tmp/version.cpp
            g++ -std=c++17 -I/usr/local/include/onnxruntime /tmp/version.cpp -lonnxruntime -o /tmp/ort-version
            test "$(/tmp/ort-version)" = 1.23.2
          '

  # The name of the job
  ROS_CI:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ros_distribution:
          - jazzy
          # - rolling
        include:
          # ROS 2 Jazzy Jalisco
          - docker_image: ubuntu:noble
            ros_distribution: jazzy
            ros_version: 2
          # ROS 2 Rolling Ridley
          # - docker_image: ubuntu:noble
          #   ros_distribution: rolling
          #   ros_version: 2
    container:
      image: ${{ matrix.docker_image }}
    steps:
      - name: Setup workspace
        run: mkdir -p ros_ws/src

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ros_ws/src

      - name: Setup ROS environment
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: ${{ matrix.ros_distribution }}

      - name: Check and Install ROS dependencies
        shell: bash
        run: |
          set -e
          source /opt/ros/${{ matrix.ros_distribution }}/setup.bash
          echo "--- Updating rosdep definitions ---"
          rosdep update
          echo "--- Installing system dependencies for ROS 2 ${{ matrix.ros_distribution }} ---"
          rosdep install --from-paths ros_ws/src --ignore-src -y -r --rosdistro ${{ matrix.ros_distribution }} --skip-keys dynamixel_hardware_interface
          echo "--- Performing rosdep check for ROS 2 ${{ matrix.ros_distribution }} ---"
          if rosdep check --from-paths ros_ws/src --ignore-src --rosdistro ${{ matrix.ros_distribution }} --skip-keys dynamixel_hardware_interface; then
            echo "--- rosdep check passed ---"
          else
            echo "--- rosdep check failed: Missing system dependencies or unresolvable keys. ---"
            exit 1
          fi

      - name: Install ONNX Runtime
        shell: bash
        run: |
          apt-get update && apt-get install -y curl ca-certificates unzip
          bash ros_ws/src/scripts/install_onnxruntime.sh

      - name: Build and Test
        uses: ros-tooling/action-ros-ci@v0.3
        with:
          target-ros2-distro: ${{ matrix.ros_distribution }}
          vcs-repo-file-url: "https://raw.githubusercontent.com/ROBOTIS-GIT/ai_sapiens/${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}/ai_sapiens_ci.repos"
          package-name: |
            ai_sapiens
            ai_sapiens_bringup
            ai_sapiens_interfaces
            ai_sapiens_joint_group_impedance_controller
            ai_sapiens_rc_broadcaster
            ai_sapiens_description
            ai_sapiens_mujoco
            ai_sapiens_sim2real
            mujoco_hardware_interface
            radiomaster_usb_hardware_interface
