policy_joints:
- left_hip_roll_joint
- right_hip_roll_joint
step_dt: 0.02
joint_properties:
  left_hip_roll_joint:
    default_position: 0.1
    stiffness: 76.5
    damping: 4.87
    position_limit: null
  right_hip_roll_joint:
    default_position: -0.2
    stiffness: 76.5
    damping: 4.87
    position_limit: null
commands: {}
actions:
  joint_pos:
    clip: null
    scale: [0.5, 0.5]
    offset: [0.1, -0.2]
observations:
  supermimic:
    schema: cyclo.supermimic.external_goal.v1
    encoder: motion
    representation: gencoord
    actor_obs: proprio
    motion_goal:
      frames: 10
      stride: 5
      start_offset: 1
      groups:
      - layout: frame_major
        terms:
          future_joint_pos:
            scale: 1.0
            clip: null
          future_joint_vel:
            scale: 1.0
            clip: null
      - layout: frame_major
        terms:
          future_root_orientation:
            scale: 1.0
            clip: null
    history:
      layout: term_major
      terms:
        projected_gravity:
          scale: 1.0
          clip: null
          history_length: 3
        base_ang_vel:
          scale: 1.0
          clip: null
          history_length: 3
        joint_pos_rel:
          scale: 1.0
          clip: null
          history_length: 3
        joint_vel_rel:
          scale: 1.0
          clip: null
          history_length: 3
        last_action:
          scale: 1.0
          clip: null
          history_length: 3
