  # 전신 ALS + 한강 회복 PublicBody v6: 62200에서 이어 학습한 최종 69999.
  # 2026-09-28_09-53-21-919298: public 몸체·학습용 발 충돌·물리 5ms/solver 10 유지.
  # 좌우 다리 충돌 패널티: 가중치 -0.5, 접촉력 10 N 초과. 보행·낙상 회복 모두 적용.
  # 왼다리↔오른다리, 왼발↔오른다리, 오른발↔왼다리, 양발 충돌 포함. 같은 쪽 다리·지면 접촉 제외.
  # 급상승 패널티: 가중치 -0.5, 회복 중 몸통 수직 상승 속도 0.8 m/s 초과량에 비례한 제곱 비용.
  # 일반 보행·달리기에는 급상승 패널티 미적용. 속도를 강제로 제한하는 방식은 아님.
  # 손 24종 형상·크기·접촉 강성 랜덤화, 머리/몸체 지면 충격 및 회복 초기 자세 설정 유지.
  # 전후진 ±2.5 m/s, 횡이동 ±1.0 m/s, 회전 ±1.8 rad/s. 기존 ALS/한강 회복 모션, phase 없음.
  # ONNX 내부 history 재정렬 적용, YAML history_ordering 없음, command history 유지.
  velocity_fullbody_als_hangang_recovery_public_body_lateral1_v6_lpf6_69999:
    kind: policy
    asset: locomotion/velocity/walk_fullbody_als_hangang_recovery_public_body_lateral1_v6_lpf6_69999

  # 전신 AMP PublicBody v6: scratch40k 39999에서 20k 추가학습 중 54500 중간 체크포인트. 평지 메인 v6.
  # ALS 보행 + 한강 낙상 회복, LPF 6 Hz. 커리큘럼·옵티마이저 유지. 지형 랜덤화·Motifect 턴 추가 전 비교 기준.
  # 좌우 다리·반대쪽 발 충돌 -0.5, 회복 상승속도 0.8 m/s 초과 -0.5, 머리 접촉·몸체/발 충격 패널티.
  # 손 24종 형상·치수·접촉 랜덤화. 전후진 ±2.5 m/s, 횡이동 ±1.0 m/s, 회전 ±1.8 rad/s.
  # ONNX 내부 history 변환, 과거 속도 명령 보존. gait phase 없음.
  velocity_fullbody_als_hangang_recovery_public_body_lateral1_v6_scratch40k_resume20k_lpf6_54500:
