state_machine:
  initial: Damping
  states:
    Damping:
      run: damping
      transitions:
        - when: ReadyPoseRequested
          to: ReadyPose
    ReadyPose:
      run: ready_pose
      transitions:
        - when: DampingRequested
          to: Damping
        - when: VelocityRequested
          to: Velocity
        - when: MimicRequested
          select: mimic_ready_selector 
    ZeroPose:
      run: posture_zero_pose
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity
        - when: MimicRequested
          select: mimic_selector
    Velocity:
      # run: velocity_policy_amp_hangang # velocity_policy_amp_hangang # velocity_policy_insu_mjlab     #velocity_policy_jhl_0806_v1    #velocity_policy_jhl_0715_v1 # velocity_policy_woojin_pure_k1
      # run: velocity_policy_amp_hangang
      # run: velocity_policy_amp_hangang_limited
      # run: velocity_policy_insu_mjlab
      # run: velocity_policy_woojin_amp_mjlab_k1_head_safe_50000
      # run: velocity_policy_walk_terrain
      # run: velocity_e1_reference_lpf6_29999
      # run: velocity_fullbody_mm_run15_lpf6_29600
      # run: velocity_fullbody_als_hangang_recovery_public_body_lateral1_v6_lpf6_69999
      run: velocity_fullbody_als_hangang_recovery_public_body_lateral1_v6_scratch40k_resume20k_lpf6_54500
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: MimicRequested
          trigger: edge
          select: mimic_selector

    SubVelocityTerrain:
      run: velocity_policy_walk_terrain
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity

    SubVelocityHangangRun:
      run: velocity_policy_amp_hangang
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity

    Mimic:
      abstract: true
      transitions:
        - when: DampingRequested
          to: Damping
        - when: ReadyPoseRequested
          to: ReadyPose
        - when: VelocityRequested
          to: Velocity
    MimicDance1:
      parent: Mimic
      run: mimic_dance1
    MimicDance2:
      parent: Mimic
      run: mimic_dance2
    # MimicJump:
    #   parent: Mimic
    #   run: mimic_jump
    MimicJumpNewton:
      parent: Mimic
      run: mimic_jump_newton
    # MimicRedred:
    #   parent: Mimic
    #   run: mimic_redred
    MimicRedredNewton:
      parent: Mimic
      run: mimic_redred_newton
    # MimicRedredMjlab:
    #   parent: Mimic
    #   run: mimic_mjlab_redred
    MimicSquat:
      parent: Mimic
      run: mimic_squat
    # MimicCoinPick:
    #   parent: Mimic
    #   run: mimic_coin_pick
    MimicCoinPickNewton:
      parent: Mimic
      run: mimic_coin_pick_newton
    # MimicRedredWoojinK1First:
    #   parent: Mimic
    #   run: mimic_redred_woojin_k1_first
    # MimicBoxingK05Motion:
    #   parent: Mimic
    #   run: mimic_boxing_k05_motion
    # MimicBoxingNewUrdf:
