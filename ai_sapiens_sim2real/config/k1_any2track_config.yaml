# Opt-in Redred Any2Track deployment; selector 204.
# ReadyPose matches frame zero of the supplied redred_k1.csv.
robot_joint_order:
- left_hip_pitch_joint
- left_hip_roll_joint
- left_hip_yaw_joint
- left_knee_joint
- left_ankle_pitch_joint
- left_ankle_roll_joint
- right_hip_pitch_joint
- right_hip_roll_joint
- right_hip_yaw_joint
- right_knee_joint
- right_ankle_pitch_joint
- right_ankle_roll_joint
- waist_yaw_joint
- left_shoulder_pitch_joint
- left_shoulder_roll_joint
- left_shoulder_yaw_joint
- left_elbow_joint
- left_wrist_roll_joint
- right_shoulder_pitch_joint
- right_shoulder_roll_joint
- right_shoulder_yaw_joint
- right_elbow_joint
- right_wrist_roll_joint
policy_action_transition:
  enabled: true
  duration: 0.1
policy_asset_roots:
- ../assets/k1
mimic_defaults:
  fps: 50
  time_start: 0.0
  time_end: auto
  on_complete: Velocity
authority:
  api_entry:
    warmup_duration: 3.0
    velocity_neutral_threshold: 0.05
    allowed_from_states:
    - Damping
    - ReadyPose
    - Velocity
  default_velocity_state: Velocity
teleop_input:
  plugin: ai_sapiens_sim2real/RadiomasterPocketTeleopInputPlugin
  config: teleop/radiomaster_pocket.yaml
  vel_command_timeout: 0.2
  timeout: 0.2
teleop_conditions:
  DampingRequested:
    input_code: 1
  ReadyPoseRequested:
    input_code: 2
  VelocityRequested:
    input_code: 3
  MimicRequested:
    input_code: 4
selectors:
  mimic_selector:
    table:
      204: MimicRedredAny2Track
state_machine:
  initial: Damping
  states:
    Damping:
      run: damping
      transitions:
      - when: ReadyPoseRequested
        to: ReadyPose
    ReadyPose:
      run: ready_pose
      transitions:
      - when: DampingRequested
        to: Damping
      - when: VelocityRequested
        to: Velocity
      - when: MimicRequested
        select: mimic_selector
    Velocity:
      run: velocity_policy
      transitions:
      - when: DampingRequested
        to: Damping
      - when: ReadyPoseRequested
        to: ReadyPose
      - when: MimicRequested
        trigger: edge
        select: mimic_selector
    Mimic:
      abstract: true
      transitions:
      - when: DampingRequested
        to: Damping
      - when: ReadyPoseRequested
        to: ReadyPose
      - when: VelocityRequested
        to: Velocity
    MimicRedredAny2Track:
      parent: Mimic
      run: mimic_redred_any2track
state_behaviors:
  damping:
    kind: damping
    damping:
      values:
