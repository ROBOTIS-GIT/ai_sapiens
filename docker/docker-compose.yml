services:
  ai_sapiens:
    container_name: ai_sapiens
    image: robotis/ai-sapiens:arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: missing
    tty: true
    restart: always
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio: 99
      rttime: -1
      memlock: 8428281856
    network_mode: host
    ipc: host
    # Comment out this block (the 7 lines below) on hosts without the
    # NVIDIA Container Toolkit; otherwise the container fails to start.
    # Only NVIDIA GPUs need this block; other GPUs render through Mesa.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics, display, utility]
    environment:
     - DISPLAY=${DISPLAY}
     - QT_X11_NO_MITSHM=1
     - RMW_IMPLEMENTATION=rmw_zenoh_cpp
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp/.docker.xauth:/tmp/.docker.xauth:rw
      - ./workspace:/workspace
      - ../:/root/ros2_ws/src/ai_sapiens
      - /var/run/robotis/agent_sockets/ai_sapiens:/var/run/agent
    privileged: true

