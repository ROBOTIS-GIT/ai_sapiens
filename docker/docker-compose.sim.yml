# Simulation overlay for docker-compose.yml, used by `container.sh --sim`.
#
# The base compose file pulls the published arm64 image built for the robot's
# onboard computer. On a workstation running the MuJoCo sim2sim environment we
# instead build the image locally from docker/Dockerfile, which installs the
# MuJoCo and GLFW libraries that ai_sapiens_mujoco links against.
#
# colcon artifacts live in named volumes so that stopping the container does not
# discard the workspace build. Remove them with
# `docker volume rm docker_ai_sapiens_sim_build docker_ai_sapiens_sim_install`
# if a rebuilt image ever leaves stale artifacts behind.

services:
  ai_sapiens:
    image: ai-sapiens:sim
    build:
      context: ..
      dockerfile: docker/Dockerfile
    pull_policy: build
    restart: 'no'
    volumes:
      - ai_sapiens_sim_build:/root/ros2_ws/build
      - ai_sapiens_sim_install:/root/ros2_ws/install

volumes:
  ai_sapiens_sim_build:
  ai_sapiens_sim_install:
